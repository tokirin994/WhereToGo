services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: smartledger
      POSTGRES_USER: smartledger
      POSTGRES_PASSWORD: ${SMARTLEDGER_DB_PASSWORD:?Copy .env.example to .env and set a strong password}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - smartledger-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartledger -d smartledger"]
      interval: 5s
      timeout: 3s
      retries: 12

  api:
    build:
      context: ./backend
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/smartledger
      SPRING_DATASOURCE_USERNAME: smartledger
      SPRING_DATASOURCE_PASSWORD: ${SMARTLEDGER_DB_PASSWORD:?Copy .env.example to .env and set a strong password}
      SMARTLEDGER_OIDC_ISSUER: ${SMARTLEDGER_OIDC_ISSUER:?Set the trusted OIDC issuer in .env}
      SMARTLEDGER_OIDC_AUDIENCE: ${SMARTLEDGER_OIDC_AUDIENCE:?Set the expected JWT audience in .env}
      SMARTLEDGER_ALLOWED_ORIGINS: ${SMARTLEDGER_ALLOWED_ORIGINS:-http://localhost:5173,http://localhost:5174}
      SMARTLEDGER_PUBLIC_URL: ${SMARTLEDGER_PUBLIC_URL:-http://localhost:5174}
      PORT: 8090
      API_OIDC_JWK_SET_URI: ${API_OIDC_JWK_SET_URI:-}
      API_ALLOWED_SUBJECTS: ${API_ALLOWED_SUBJECTS:-}
      API_ALLOW_ANY_AUTHENTICATED_USER: ${API_ALLOW_ANY_AUTHENTICATED_USER:-false}
      API_REQUESTS_PER_MINUTE: ${API_REQUESTS_PER_MINUTE:-120}
      API_WRITES_PER_MINUTE: ${API_WRITES_PER_MINUTE:-30}
      API_WEBDAV_REQUESTS_PER_MINUTE: ${API_WEBDAV_REQUESTS_PER_MINUTE:-10}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-4}
      FLYWAY_HISTORY_TABLE: ${FLYWAY_HISTORY_TABLE:-flyway_schema_history}
      SMARTLEDGER_CREDENTIAL_KEYRING: ${SMARTLEDGER_CREDENTIAL_KEYRING:?Set an external AES-256 keyring secret}
    ports:
      - "127.0.0.1:${SMARTLEDGER_API_PORT:-8090}:8090"
    depends_on:
      db:
        condition: service_healthy

volumes:
  smartledger-db:
