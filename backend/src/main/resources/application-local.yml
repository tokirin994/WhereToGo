# Explicit loopback development profile; the local Keycloak realm owns real accounts.
api:
  security:
    local-development: true
    issuer: http://localhost:8091/realms/local
    audience: wheretogo-api
    allowed-origins: http://localhost:5173,http://127.0.0.1:5173,http://localhost:5174,http://127.0.0.1:5174
