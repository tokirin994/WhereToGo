name: wheretogo-vps
x-service: &service
  restart: unless-stopped
  security_opt: [no-new-privileges:true]
  logging: {driver: local, options: {max-size: '10m', max-file: '3'}}
  stop_grace_period: 40s
x-api: &api
  <<: *service
  read_only: true
  cap_drop: [ALL]
  tmpfs: ['/tmp:size=96m,mode=1777']
  mem_limit: 512m
  pids_limit: 160

services:
  db:
    <<: *service
    build: {context: ., dockerfile: Postgres.Dockerfile}
    image: wheretogo-vps-postgis:16
    mem_limit: 768m
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres-password
      POSTGRES_INITDB_ARGS: --auth-host=scram-sha-256
    command: [postgres, -c, shared_buffers=128MB, -c, max_connections=40, -c, password_encryption=scram-sha-256]
    secrets: [postgres-password, travel-password, travel-migration-password, ledger-password, ledger-migration-password, identity-password]
    volumes:
      - /home/data/wheretogo/postgres:/var/lib/postgresql/data
      - ./init-databases.sh:/docker-entrypoint-initdb.d/10-databases.sh:ro
    networks: [travel-data, ledger-data, identity-data]
    healthcheck:
      test: [CMD-SHELL, 'test -f /var/lib/postgresql/data/.wtg-databases-ready && pg_isready -h 127.0.0.1 -U postgres -d postgres']
      start_period: 120s
      interval: 5s
      timeout: 5s
      retries: 40

  identity:
    <<: *service
    build: {context: ., dockerfile: Identity.Dockerfile}
    image: wheretogo-vps-identity:26.8.1
    mem_limit: 768m
    pids_limit: 256
    environment:
      KC_DB: postgres
      KC_DB_URL: jdbc:postgresql://db:5432/identity
      KC_DB_USERNAME: identity_owner
      KC_DB_POOL_INITIAL_SIZE: '1'
      KC_DB_POOL_MIN_SIZE: '1'
      KC_DB_POOL_MAX_SIZE: '5'
      KC_HOSTNAME: ${PUBLIC_ORIGIN:?Set PUBLIC_ORIGIN}/identity
      KC_HOSTNAME_STRICT: 'true'
      KC_HTTP_ENABLED: 'true'
      KC_HTTP_RELATIVE_PATH: /identity
      KC_PROXY_HEADERS: xforwarded
      KC_PROXY_TRUSTED_ADDRESSES: 172.29.231.2/32
      KC_BOOTSTRAP_ADMIN_USERNAME: operator-admin
      PORTAL_PUBLIC_URL: ${PUBLIC_ORIGIN}/
      JAVA_OPTS_APPEND: -Xms64m -Xmx384m -XX:MaxMetaspaceSize=192m
    command:
      - |
        export KC_DB_PASSWORD="$$(</run/secrets/identity-password)"
        export KC_BOOTSTRAP_ADMIN_PASSWORD="$$(</run/secrets/identity-admin-password)"
        exec /opt/keycloak/bin/kc.sh start --optimized --import-realm
    secrets: [identity-password, identity-admin-password]
    volumes:
      - /opt/wheretogo/identity-import:/opt/keycloak/data/import:ro
      - identity-data:/opt/keycloak/data
    networks: [edge, identity-data]
    depends_on: {db: {condition: service_healthy}}

  travel-api:
    <<: *api
    build: {context: ., dockerfile: Api.Dockerfile, args: {ARTIFACT: app/travel.jar}}
    image: wheretogo-vps-travel:java8
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/travelatlas
      SPRING_DATASOURCE_USERNAME: travel_app
      SPRING_FLYWAY_URL: jdbc:postgresql://db:5432/travelatlas
      SPRING_FLYWAY_USER: travel_migrator
      APP_OIDC_ISSUER: ${PUBLIC_ORIGIN}/identity/realms/personal
      APP_OIDC_AUDIENCE: wheretogo-api
      API_OIDC_JWK_SET_URI: ${PUBLIC_ORIGIN}/identity/realms/personal/protocol/openid-connect/certs
      APP_CORS_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
      API_ALLOWED_SUBJECTS: ${API_ALLOWED_SUBJECTS:-}
      API_ALLOW_ANY_AUTHENTICATED_USER: ${API_ALLOW_ANY_AUTHENTICATED_USER:-false}
      API_DOCS_ENABLED: 'false'
      DB_POOL_SIZE: '2'
      HTTP_MAX_THREADS: '16'
      SERVER_SHUTDOWN: graceful
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx256m -XX:MaxMetaspaceSize=128m -Djava.net.preferIPv4Stack=true
      TRAVEL_AI_BASE_URL: ${TRAVEL_AI_BASE_URL:-}
      TRAVEL_AI_MODEL: ${TRAVEL_AI_MODEL:-}
      TRAVEL_AI_PROTOCOL: ${TRAVEL_AI_PROTOCOL:-chat-completions}
    secrets:
      - {source: travel-password, target: spring.datasource.password}
      - {source: travel-migration-password, target: spring.flyway.password}
      - {source: travel-ai-key, target: travel.ai.api-key}
    networks: [edge, travel-data]
    depends_on: {db: {condition: service_healthy}}

  ledger-api:
    <<: *api
    build: {context: ., dockerfile: Api.Dockerfile, args: {ARTIFACT: app/ledger.jar}}
    image: wheretogo-vps-ledger:java8
    environment:
      SPRING_CONFIG_IMPORT: configtree:/run/secrets/
      SPRING_DATASOURCE_URL: jdbc:postgresql://db:5432/smartledger
      SPRING_DATASOURCE_USERNAME: ledger_app
      SPRING_FLYWAY_URL: jdbc:postgresql://db:5432/smartledger
      SPRING_FLYWAY_USER: ledger_migrator
      SMARTLEDGER_OIDC_ISSUER: ${PUBLIC_ORIGIN}/identity/realms/personal
      SMARTLEDGER_OIDC_AUDIENCE: smartledger-api
      API_OIDC_JWK_SET_URI: ${PUBLIC_ORIGIN}/identity/realms/personal/protocol/openid-connect/certs
      SMARTLEDGER_ALLOWED_ORIGINS: ${PUBLIC_ORIGIN}
      SMARTLEDGER_PUBLIC_URL: ${PUBLIC_ORIGIN}/ledger/
      API_ALLOWED_SUBJECTS: ${API_ALLOWED_SUBJECTS:-}
      API_ALLOW_ANY_AUTHENTICATED_USER: ${API_ALLOW_ANY_AUTHENTICATED_USER:-false}
      SMARTLEDGER_CREDENTIAL_KEY_FILE: /run/secrets/credential-keyring.json
      DB_POOL_SIZE: '2'
      HTTP_MAX_THREADS: '16'
      SERVER_SHUTDOWN: graceful
      PORT: '8090'
      JAVA_TOOL_OPTIONS: -Xms32m -Xmx256m -XX:MaxMetaspaceSize=128m -Djava.net.preferIPv4Stack=true
    secrets:
      - {source: ledger-password, target: spring.datasource.password}
      - {source: ledger-migration-password, target: spring.flyway.password}
      - {source: credential-keyring, target: credential-keyring.json}
    networks: [edge, ledger-data]
    depends_on: {db: {condition: service_healthy}}

  gateway:
    <<: *service
    image: caddy:2.11.7-alpine
    mem_limit: 128m
    read_only: true
    cap_drop: [ALL]
    cap_add: [NET_BIND_SERVICE]
    environment: {PUBLIC_HOST: '${PUBLIC_HOST}'}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - ./dist/portal:/srv/portal:ro
      - ./dist/ledger:/srv/ledger:ro
      - caddy-data:/data
      - caddy-config:/config
    tmpfs: ['/tmp:size=32m,mode=1777']
    ports: ['80:80', '443:443']
    networks: {edge: {ipv4_address: 172.29.231.2}}

networks:
  edge: {ipam: {config: [{subnet: 172.29.231.0/24}]}}
  travel-data: {internal: true}
  ledger-data: {internal: true}
  identity-data: {internal: true}
volumes:
  identity-data:
  caddy-data:
  caddy-config:
secrets:
  postgres-password: {file: /opt/wheretogo/secrets/postgres-password}
  travel-password: {file: /opt/wheretogo/secrets/travel-password}
  travel-migration-password: {file: /opt/wheretogo/secrets/travel-migration-password}
  ledger-password: {file: /opt/wheretogo/secrets/ledger-password}
  ledger-migration-password: {file: /opt/wheretogo/secrets/ledger-migration-password}
  identity-password: {file: /opt/wheretogo/secrets/identity-password}
  identity-admin-password: {file: /opt/wheretogo/secrets/identity-admin-password}
  credential-keyring: {file: /opt/wheretogo/secrets/credential-keyring.json}
  travel-ai-key: {file: /opt/wheretogo/secrets/travel-ai-key}
