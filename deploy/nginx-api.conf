# Optional gateway for a server you control. Replace upstream names with your private API addresses.
# Render direct deployments can use each backend's JWT and per-instance guards without this gateway.
worker_processes auto;
events { worker_connections 512; }
http {
    server_tokens off;
    limit_req_zone $binary_remote_addr zone=api_peer:10m rate=10r/s;
    limit_req_status 429;
    log_format api '$request_id $request_method $status $request_time';
    access_log /var/log/nginx/access.log api;
    upstream travel_api { server travel-api:8080; }
    upstream ledger_api { server ledger-api:8090; }
    server {
        listen 8080;
        # Terminate HTTPS at your hosting platform or an explicitly configured TLS listener.
        client_header_timeout 10s;
        client_body_timeout 20s;
        client_max_body_size 11m;
        add_header X-Content-Type-Options nosniff always;
        add_header Referrer-Policy no-referrer always;
        proxy_connect_timeout 10s;
        proxy_read_timeout 90s;
        proxy_set_header Host $proxy_host;
        proxy_set_header Authorization $http_authorization;
        proxy_set_header Connection '';
        # Do not trust incoming forwarding headers for identity or local-mode authorization.
        proxy_set_header X-Forwarded-For '';
        proxy_set_header X-Forwarded-Proto '';
        proxy_set_header X-Real-IP '';
        location /travel-api/ {
            limit_req zone=api_peer burst=20 nodelay;
            client_max_body_size 1m;
            proxy_pass http://travel_api/;
        }
        location /ledger-api/ {
            limit_req zone=api_peer burst=20 nodelay;
            proxy_pass http://ledger_api/;
        }
        location / { return 404; }
    }
}
